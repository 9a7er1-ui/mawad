<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موادي — الصف الأول المتوسط | ذي النورين</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{--bg:#E7F0EB;--surface:#FFFFFF;--surface2:#F2F8F5;--ink:#12312B;--muted:#56716A;--line:#CFE0D8;--emerald:#0E7A5C;--on-emerald:#FFFFFF;--emerald-soft:#D7EFE5;--gold:#B5852A;--gold-soft:#F6EBD3;--hl:#C2185B;
--s-quran:#0E7A5C;--s-tawheed:#2D69A8;--s-tafsir:#6E46A8;--s-hadith:#B5852A;--s-fiqh:#B3225A;--s-tajweed:#0F8A8A;--s-hifz:#0E7A5C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1E1A;--surface:#12302A;--surface2:#173A33;--ink:#E5F2ED;--muted:#9BB7AE;--line:#2A4F45;--emerald:#3CC496;--on-emerald:#062019;--emerald-soft:#173F35;--gold:#E2B456;--gold-soft:#3A3220;--hl:#FF73AC;--s-quran:#3CC496;--s-tawheed:#6FA6E0;--s-tafsir:#C3A2F2;--s-hadith:#E2B456;--s-fiqh:#F27DA8;--s-tajweed:#4FD1D1;--s-hifz:#3CC496;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Almarai,"Geeza Pro",Tahoma,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 8px}
.brand{font-weight:800;font-size:15px}.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font:700 13px Almarai,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer}
.btn.primary{background:var(--emerald);color:var(--on-emerald);border-color:var(--emerald)}
/* hero */
.hero{background:var(--emerald);color:var(--on-emerald);border-radius:22px;padding:22px 22px 20px;margin:8px 0 18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.08)}
.hero .when{font-size:13px;opacity:.85}
.hero .label{font-size:14px;margin-top:10px;opacity:.9}
.hero .surah{font-family:"Amiri Quran",serif;font-size:clamp(34px,8vw,48px);line-height:1.5;margin:2px 0}
.hero .ayat{font-size:17px;font-weight:700}
.hero .wk{margin-top:14px;display:inline-block;background:rgba(255,255,255,.14);padding:4px 12px;border-radius:999px;font-size:13px}
.notice{background:var(--gold-soft);border:1px solid var(--gold);color:var(--ink);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:700;font-size:14px}
/* weeks */
.weeks{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.chip{flex:0 0 auto;min-width:54px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 10px;cursor:pointer;font:700 15px Almarai,sans-serif;color:var(--ink)}
.chip small{display:block;font-weight:400;font-size:10px;color:var(--muted)}
.chip.now{border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip.sel small{color:var(--bg);opacity:.75}
.chip.brk{font-size:12px;color:var(--gold)}
h2.wtitle{font-size:22px;margin:14px 0 2px}
.wsub{color:var(--muted);font-size:14px;margin-bottom:14px}
/* cards */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;border-top:4px solid var(--c,var(--emerald))}
.card h3{margin:0 0 8px;font-size:16px;color:var(--c)}
.lesson{padding:8px 0;border-top:1px dashed var(--line)}.lesson:first-of-type{border-top:0}
.lt{font-weight:700;font-size:15px}
.lt.muted{color:var(--muted);font-weight:400}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.act{font:700 12px Almarai,sans-serif;text-decoration:none;padding:5px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.act.v{background:var(--emerald-soft);border-color:transparent}
.act.q{background:var(--gold-soft);border-color:transparent}
.done{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer;margin-inline-start:auto}
.done input{accent-color:var(--emerald)}
.soon{font-size:12px;color:var(--muted)}
.hifz{grid-column:1/-1}
.hrow{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.hrow:first-of-type{border-top:0}
.hrow .d{color:var(--muted)}.hrow .s{font-family:"Amiri Quran",serif;font-size:19px}
.hrow.today{background:var(--emerald-soft);border-radius:10px;padding-inline:8px;border-top-color:transparent}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.brkbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center;font-size:18px;font-weight:700;color:var(--gold)}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
/* video modal */
dialog{border:0;padding:0;border-radius:16px;width:min(92vw,800px);background:#000}
dialog::backdrop{background:rgba(0,0,0,.7)}
.vframe{position:relative;aspect-ratio:16/9}.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vclose{position:absolute;top:8px;left:8px;z-index:2;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:999px;width:36px;height:36px;font-size:18px;cursor:pointer}

/* worksheet */
.wsv{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 18px 22px;margin-top:10px}
.wsbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}
.wsv h1{font-size:21px;margin:0 0 8px;color:var(--emerald)}
.info{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.info span{font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.stu{display:grid;grid-template-columns:1fr 120px;gap:8px;margin-bottom:6px}
.stu label{font-size:12px;color:var(--muted);display:block}
.stu input,.stu select{width:100%;font:700 15px Almarai,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink)}
.act-h{font-size:17px;font-weight:800;margin:22px 0 6px;padding-top:14px;border-top:2px solid var(--line);color:var(--ink)}
.wsv p{margin:4px 0 8px}
.keys{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:8px 0}
.key{background:var(--emerald-soft);border-radius:12px;padding:10px;text-align:center}.key b{display:block}.key small{color:var(--muted)}
.fill{margin:10px 0}.fill .ft{font-weight:700}
textarea.ans{display:block;width:100%;min-height:44px;margin:6px 0;font:16px/1.8 Almarai,sans-serif;padding:8px 12px;border:1px solid var(--line);border-bottom:2px solid var(--emerald);border-radius:10px;background:var(--surface2);color:var(--ink);resize:none;overflow:hidden}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:40px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.pill{font:700 14px Almarai,sans-serif;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.pill.pick{background:var(--gold);color:#fff;border-color:var(--gold)}
.cols{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.col{border:2px solid var(--line);border-radius:14px;padding:10px;min-height:120px;cursor:pointer;background:var(--surface2)}
.col.target{border-color:var(--gold)}
.col h4{margin:0;font-size:15px;color:var(--emerald)}.col small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.col .pill{display:block;width:100%;margin-top:6px;text-align:start}
.hint{font-size:12px;color:var(--muted)}
.saved{font-size:12px;color:var(--emerald)}
.wsstate{font-size:11px;color:var(--emerald);margin-inline-start:4px}
.printhead{display:none}
@media print{
 body{background:#fff;color:#000}
 header.top,#notices,.hero,.weeks,footer,.wsbar,.hint,.no-print{display:none!important}
 .wsv{border:0;padding:0}
 .printhead{display:block;font-size:12px;margin-bottom:6px}
 textarea.ans{border:0;border-bottom:1px dotted #000;border-radius:0;background:none}
 textarea.ans::placeholder,.stu input::placeholder{color:transparent}
 .pool{display:none}
 .col{background:none;break-inside:avoid}
 .blank textarea.ans{color:transparent}
 .blank .col .pill{display:none}
 .blank .pool{display:flex;border:1px solid #999}
 .blank .pool .pill{border:1px solid #999}
 .act-h{break-after:avoid}
}
</style>
</head>

 <header class="top">
  <div class="brand">موادي — الصف الأول المتوسط<small>مدرسة ذي النورين المتوسطة لتحفيظ القرآن الكريم</small></div>

<script>
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const MONTHS=["","محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
const ORD=["","الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر","الثالث عشر","الرابع عشر","الخامس عشر","السادس عشر","السابع عشر","الثامن عشر"];
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
const K=(m,d)=>m*100+d;
function todayH(){try{const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(new Date());const g=t=>parseInt((p.find(x=>x.type===t)||{}).value);return{y:g('year'),m:g('month'),d:g('day')}}catch(e){return null}}
const T=todayH(); const TK=T&&T.y===1448?K(T.m,T.d):(T&&T.y>1448?99999:0);
function currentIdx(){if(!TK)return 0;for(let i=0;i<WEEKS.length;i++){const w=WEEKS[i];if(TK<=K(...w.to))return i}return WEEKS.length-1}
const NOW=currentIdx();
const hkeys=Object.keys(HIFZ).sort((a,b)=>K(...a.split('/').map(Number))-K(...b.split('/').map(Number)));
const range=w=>`${AR(w.from[1])} ${MONTHS[w.from[0]]} – ${AR(w.to[1])} ${MONTHS[w.to[0]]}`;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v?localStorage.setItem(k,'1'):localStorage.removeItem(k)}catch(e){}}};

function hero(){
 const el=document.getElementById('hero');const w=WEEKS[NOW];
 let key=hkeys.find(k=>K(...k.split('/').map(Number))>=TK&&HIFZ[k]);
 const isToday=key&&K(...key.split('/').map(Number))===TK;
 const when=T?`${AR(T.d)} ${MONTHS[T.m]||''} ${AR(T.y)}هـ`:'';
 if(!key){el.innerHTML=`<div class="when">${when}</div><div class="surah">بارك الله فيكم</div><div class="ayat">انتهت خطة حفظ هذا الفصل</div>`;return}
 const [m,d]=key.split('/').map(Number);const h=HIFZ[key];
 const idx=hkeys.filter(k=>{const kk=K(...k.split('/').map(Number));const wk=WEEKS.find(x=>kk>=K(...x.from)&&kk<=K(...x.to));return wk&&wk===WEEKS.find(x=>K(m,d)>=K(...x.from)&&K(m,d)<=K(...x.to))}).indexOf(key);
 const dayName=DAYS[idx]||'';const thu=idx===4;
 el.innerHTML=`<div class="when">${when}</div>
  <div class="label">${isToday?(thu?'تلاوة اليوم':'حفظ اليوم'):(thu?'التلاوة القادمة':'الحفظ القادم')} · ${dayName} ${AR(d)} ${MONTHS[m]}</div>
  <div class="surah">سورة ${h[0]}</div><div class="ayat">من الآية ${AR(h[1])} إلى الآية ${AR(h[2])}</div>
  <span class="wk">${w.brk?w.brk:'الأسبوع '+ORD[w.n]} · ${range(w)}</span>`;
}
function notices(){const el=document.getElementById('notices');el.innerHTML=NOTICES.filter(n=>!n.until||TK<=K(...n.until)).map(n=>`<div class="notice">${n.text}</div>`).join('')}
function weeks(sel){
 const el=document.getElementById('weeks');
 el.innerHTML=WEEKS.map((w,i)=>`<button class="chip ${w.brk?'brk':''} ${i===NOW?'now':''} ${i===sel?'sel':''}" data-i="${i}">${w.brk?'إجازة':AR(w.n)}<small>${i===NOW?'الآن':(w.brk?'الخريف':'أسبوع')}</small></button>`).join('');
 el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>show(+b.dataset.i,true));
 const s=el.querySelector('.sel');if(s)s.scrollIntoView({inline:'center',block:'nearest'});
}
function ytId(u){const m=String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:null}
function lessonHTML(l,wn,sk,i){
 if(l.off||l.rev)return `<div class="lesson"><div class="lt ${l.off?'muted':''}">${l.t}</div></div>`;
 const id=`d-${wn}-${sk}-${i}`;const a=[];
 if(l.v){const y=ytId(l.v);a.push(y?`<button class="act v" onclick="openV('${y}')">▶ شاهد الشرح</button>`:`<a class="act v" href="${l.v}" target="_blank" rel="noopener">▶ شاهد الشرح</a>`)}
 if(l.w&&WS[l.w]){const st=wsState(l.w);a.push(`<a class="act" href="#ws-${l.w}">ورقة العمل${st?`<span class="wsstate">${st}</span>`:''}</a>`)}
 if(l.q)a.push(`<a class="act q" href="${l.q}" target="_blank" rel="noopener">المسابقة</a>`);
 if(l.s)a.push(`<a class="act" href="${l.s}" target="_blank" rel="noopener">العرض</a>`);
 if(!l.v)a.push(`<span class="soon">الشرح المرئي قريبًا</span>`);
 const chk=store.get(id)?'checked':'';
 return `<div class="lesson"><div class="lt">${l.t}</div><div class="acts">${a.join('')}<label class="done"><input type="checkbox" ${chk} onchange="store.set('${id}',this.checked)">أنجزته</label></div></div>`;
}
function hifzCard(w){
 const ks=hkeys.filter(k=>{const kk=K(...k.split('/').map(Number));return kk>=K(...w.from)&&kk<=K(...w.to)});
 if(!ks.length)return '';
 return `<div class="card hifz" style="--c:var(--s-hifz)"><h3>${SUBJECTS.hifz}</h3>${ks.map((k,i)=>{const h=HIFZ[k];const [m,d]=k.split('/').map(Number);const today=K(m,d)===TK;
  return `<div class="hrow ${today?'today':''}"><span class="d">${DAYS[i]||''}<br>${AR(d)}/${AR(m)}</span>${h?`<span><span class="s">${h[0]}</span> · ${AR(h[1])}–${AR(h[2])}</span><span class="tag">${i===4?'تلاوة':'حفظ'}</span>`:`<span class="lt muted">إجازة</span><span></span>`}</div>`}).join('')}</div>`;
}
function show(i,push){
 const w=WEEKS[i];LASTWEEK=w.brk?'#break':'#w'+w.n;weeks(i);const el=document.getElementById('week');
 if(push)history.replaceState(null,'',w.brk?'#break':'#w'+w.n);
 if(w.brk){el.innerHTML=`<h2 class="wtitle">${w.brk}</h2><div class="wsub">${range(w)}</div><div class="brkbox">إجازة سعيدة — لا تنسَ مراجعة محفوظك</div>`;return}
 const L=LESSONS[w.n]||{};
 const cards=Object.keys(SUBJECTS).filter(s=>s!=='hifz'&&L[s]).map(s=>`<div class="card" style="--c:var(--s-${s})"><h3>${SUBJECTS[s]}</h3>${L[s].map((l,j)=>lessonHTML(l,w.n,s,j)).join('')}</div>`).join('');
 el.innerHTML=`<h2 class="wtitle">الأسبوع ${ORD[w.n]}</h2><div class="wsub">${range(w)}${w.note?' · '+w.note:''}</div><div class="grid">${hifzCard(w)}${cards}</div>`;
}
function openV(id){document.getElementById('vf').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;document.getElementById('vd').showModal()}
function closeV(){document.getElementById('vf').innerHTML='';document.getElementById('vd').close()}

 s.blocks.forEach((b,i)=>{
  if(b.k==='h')html+=`<div class="act-h">${esc(b.t)}</div>`;
  else if(b.k==='p')html+=`<p>${esc(b.t)}</p>`;
  else if(b.k==='keys'){const [top,bot]=b.rows;html+=`<div class="keys">${top.map((c,j)=>`<div class="key"><b>${esc(c)}</b><small>${esc((bot||[])[j]||'')}</small></div>`).join('')}</div>`}
  else if(b.k==='fill'){html+=`<div class="fill">`;b.parts.forEach((p,j)=>{if(p)html+=`<span class="ft">${esc(p)}</span>`;if(j<b.parts.length-1)html+=ta(`f${i}_${j}`)});html+=`</div>`}
  else if(b.k==='area')html+=ta(`a${i}`,Math.max(3,b.n));
  else if(b.k==='items'){/* rendered with sort */}
  else if(b.k==='sort'){
   const items=(s.blocks[i-1]||{}).items||[];const key=`s${i}`;const m=ANS[key]||{};
   html+=`<div class="hint">اضغط على العبارة ثم اضغط على العمود المناسب. للتراجع اضغط عليها داخل العمود.</div>
   <div class="pool" data-sort="${key}">${items.map((t,j)=>m[j]===undefined?`<button class="pill" data-sk="${key}" data-j="${j}">${esc(t)}</button>`:'').join('')}</div>
   <div class="cols">${b.cols.map((c,ci)=>`<div class="col" data-sk="${key}" data-c="${ci}"><h4>${esc(c.t)}</h4><small>${esc(c.s)}</small>${items.map((t,j)=>m[j]===ci?`<button class="pill" data-sk="${key}" data-j="${j}" data-in="1">${esc(t)}</button>`:'').join('')}</div>`).join('')}</div>`;
  }
 });
 html+=`<div class="wsbar no-print" style="margin-top:22px">
  <button class="btn primary" onclick="finishWS()">حفظ الإجابات</button>
  <button class="btn" onclick="printWS(false)">طباعة ورقتي</button>
  <button class="btn" onclick="printWS(true)">طباعة نسخة فارغة</button>
  <button class="btn" onclick="clearWS()">مسح الإجابات</button></div></article>`;
 const el=document.getElementById('week');el.innerHTML=html;
 ['hero','weeks','notices'].forEach(x=>document.getElementById(x).style.display='none');
 el.querySelectorAll('textarea.ans').forEach(t=>{grow(t);t.addEventListener('input',()=>{grow(t);ANS[t.dataset.k]=t.value;autosave()})});
 document.getElementById('stuName').oninput=document.getElementById('stuSec').onchange=()=>setStu({name:stuName.value,sec:stuSec.value});
 el.querySelectorAll('.pill').forEach(p=>p.onclick=e=>{e.stopPropagation();onPill(p)});
 el.querySelectorAll('.col').forEach(c=>c.onclick=()=>onCol(c));
 window.scrollTo(0,0);
}
function onPill(p){const key=p.dataset.sk,j=+p.dataset.j;if(p.dataset.in&&PICK&&PICK.key===key){onCol(p.closest('.col'));return}
 if(p.dataset.in){const m=ANS[key]||{};delete m[j];ANS[key]=m;autosave();renderKeep();return}
 PICK=(PICK&&PICK.key===key&&PICK.j===j)?null:{key,j};
 document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('pick',PICK&&x.dataset.sk===PICK.key&&+x.dataset.j===PICK.j&&!x.dataset.in));
 document.querySelectorAll('.col').forEach(c=>c.classList.toggle('target',!!PICK&&c.dataset.sk===(PICK&&PICK.key)));
}
function onCol(c){if(!PICK||c.dataset.sk!==PICK.key)return;const m=ANS[PICK.key]||{};m[PICK.j]=+c.dataset.c;ANS[PICK.key]=m;PICK=null;autosave();renderKeep()}
function renderKeep(){saveA(CUR,ANS);const y=window.scrollY;renderWS(CUR);window.scrollTo(0,y)}
let saveT;function autosave(){clearTimeout(saveT);saveT=setTimeout(()=>{const ok=saveA(CUR,ANS);const s=document.getElementById('saved');if(s)s.textContent=ok?'✓ حُفظت إجاباتك على هذا الجهاز':'تعذّر الحفظ على هذا الجهاز'},400)}
function finishWS(){ANS._sub=1;const ok=saveA(CUR,ANS);alert(ok?'تم حفظ إجاباتك. تستطيع العودة إليها في أي وقت من هذا الجهاز.':'تعذّر الحفظ. اطبع ورقتك حتى لا تضيع إجاباتك.')}
function clearWS(){if(!confirm('هل تريد مسح جميع إجاباتك في هذه الورقة؟'))return;ANS={};saveA(CUR,ANS);renderWS(CUR)}
function printWS(blank){document.body.classList.toggle('blank',blank);setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('blank'),500)},50)}
function goBack(){if(history.length>1&&LASTWEEK!==null){location.hash=LASTWEEK}else location.hash=''}
let LASTWEEK=null;

function fromHash(){const h=location.hash;if(h==='#break')return WEEKS.findIndex(w=>w.brk);const m=h.match(/^#w(\d+)$/);if(m){const i=WEEKS.findIndex(w=>w.n===+m[1]);if(i>=0)return i}return NOW}
notices();hero();route();
window.addEventListener('hashchange',route);
